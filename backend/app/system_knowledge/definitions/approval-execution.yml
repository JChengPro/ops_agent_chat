- id: approval_waiting
  title: 任务正在等待人工审批
  summary: 变更 Action 已准备完成，但尚未获得有效批准，因此不会执行。
  tags: [approval, action, waiting, policy]
  content: |
    审批卡展示的是已经解析完成的变更快照，包括目标、影响、风险和 Action Hash。用户可以只批准需要执行的项目；未选中的 Action 会记录为未执行。审批通过仅表示允许进入执行阶段，不代表命令成功或最终状态验证通过。

- id: approval_action_invalidated
  title: 审批因 Action 或能力定义变化而失效
  summary: 待审批内容与当前可执行快照不再一致，旧审批不能继续使用。
  tags: [approval, action-hash, capability-hash, invalidated]
  content: |
    Action Hash 绑定最终参数、目标、运行时、配置版本、风险和能力定义。批准时以及实际执行前，系统都会重新计算并比较指纹。如果环境配置或 Capability 定义已经变化，系统必须使旧审批失效，重新生成 Action 并再次请求审批。

    这不是普通重试错误。不要绕过 Hash 校验，也不要手工把失效审批改成 approved。

- id: approval_already_consumed
  title: 审批已被消费或重复提交
  summary: 同一项批准只能有效恢复并执行一次，重复点击不会再次执行变更。
  tags: [approval, idempotency, consumed, duplicate]
  content: |
    审批 API 通过事务和状态检查处理重复决定；Worker 真正领取变更执行时，通过原子状态转换和 consumed_at 首次写入避免重复消费。页面显示“批准中”时应等待状态刷新。若审批已经 consumed，应查看原 Run 和 Action 的最终状态，而不是创建重复执行。数据库防重不能保证任意远程命令的端到端 exactly-once，失联后仍需复核目标状态。

- id: worker_lease_expired
  title: Agent Worker 租约或心跳超时
  summary: 领取任务的 Worker 未在租约内维持心跳，系统无法确认正在执行的动作结果。
  tags: [worker, lease, heartbeat, recovery, execution-unknown]
  content: |
    对只读任务可以重新发起调查；对可能已经开始的变更，超时不等于没有执行。系统应把执行中的 Action 标记为 execution_unknown，不自动重放命令，并通过新的只读检查确认目标现状。这样可避免网络抖动或 Worker 重启导致同一变更执行两次。

- id: action_execution_unknown
  title: Action 的执行结果未知
  summary: 远程命令可能已经到达目标，但系统没有获得可信的最终结果。
  tags: [action, execution-unknown, timeout, recovery]
  content: |
    常见原因包括 SSH 命令超时、Worker 失联或进程在收到远端响应前退出。此状态必须与 failed 区分，因为盲目重试可能重复变更。应先执行独立、只读、幂等的状态检查；只有确认原操作未生效并重新生成 Action 后，才考虑再次审批执行。

- id: approval_lifecycle_and_verification
  title: 部分批准、审批过期与执行后的稳定验证
  summary: 选择操作、授权执行、命令结果和最终验证是不同阶段。
  tags: [部分批准, 勾选, 拒绝, 审批过期, 15分钟, succeeded, verified, 稳定验证]
  content: |
    ## 批准前
    核对项目、环境、服务、影响与恢复策略，只勾选需要执行的变更再提交；未选项不会执行。当前普通审批创建时有效期为 15 分钟，过期后不能继续使用，应重新读取状态并规划。拒绝不是失败重试，不能继续执行被拒绝的 Action。

    ## 批准后
    前端传回对应 Action Hash，API 校验审批与快照；Worker 恢复时还会核对绑定、有效期、配置与策略，并执行只读复核。审批已通过不代表命令已发出，页面需要继续跟踪 Run 与 Action 状态。

    ## 结果判断
    succeeded 表示执行阶段成功，verified 表示独立验证符合目标。服务启停等操作会在配置的窗口内连续观察；默认要求连续成功，单次 running 不足以宣称稳定恢复。停止后的预期是确实停止，不是仍 running。
    verification_failed 或 execution_unknown 时先看证据，再决定后续处理。没有注册的可靠 verifier 时不能假装成功，回滚也不是所有动作都具备的通用撤销功能。

- id: approval_change_walkthrough
  title: 一次受控重启从提出到验证的完整流程
  summary: 目标确认、策略、审批、预检查、执行和验证分别有独立含义。
  tags: [重启流程, 审批教程, 变更步骤, precheck, verifier, Action Hash]
  content: |
    ## 提出请求
    在明确项目和环境的会话里给出准确服务名。Agent 读取所需上下文并提出已注册能力，Policy 检查角色、风险和审批要求，服务端冻结 Action 的目标、参数、运行时与治理配置。

    ## 人工决定
    需要审批时，阅读卡片中的环境、动作、影响和恢复说明，再批准或拒绝。对多个动作只选择确实需要的项；未选中的项不执行。审批只针对显示的快照，不能把旧 Hash 转给另一个环境或修改参数后继续使用。

    ## 执行与检查
    恢复时再次检查权限、有效期和快照，前置只读检查确认目标条件。Runtime 执行已授权动作，保存执行证据，再使用独立 verifier 检查实际服务状态。命令退出成功和目标稳定恢复不是同一结论。

    ## 结果分支
    verified 才能说明该动作的验证条件满足；precheck_changed 应重新判断目标；verification_failed 应查看观测；execution_unknown 应先只读复核，不能盲目重放。没有注册回滚配方时不能承诺自动还原，前端取消也不是通用撤销按钮。

- id: approval_cancel_and_recovery
  title: 审批后取消、执行失败与回滚有什么区别
  summary: 取消阻止后续动作，回滚是另一项受控操作，未知结果需要先读现场。
  tags: [取消后还执行, 回滚, rollback, 未知执行, 拒绝审批, 执行失败]
  content: |
    ## 取消与拒绝
    未批准前可以拒绝变更；任务执行中可以请求取消。系统会检查状态与所有权，阻止后续步骤和晚到结果覆盖终态，但不能保证已经发往远端的命令停止。不要把 cancelled 解读为远端完全没有变化。

    ## 失败与未知
    明确收到错误可形成失败证据；超时、失联或执行后本地未提交可能只知道结果未知。先查看原 Action、工具调用和独立当前状态。未知执行不能直接改成成功，也不能直接按同一审批重试。

    ## 回滚资格
    只有能力提供确定的恢复配方且满足策略与运行条件时才有对应恢复动作。回滚本身可能失败或结果未知，需记录并验证。没有回滚配方的操作需要维护者制定恢复方案，知识中的建议不会生成新的执行权限。

    ## 恢复验收
    确认目标环境、实际状态和所需证据，再决定是否重新提出变更和审批。保留原失败记录，以便区分第一次动作和后续恢复，而不是删除记录再试一次。

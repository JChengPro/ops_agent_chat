- id: model_api_key_missing
  title: Agent 模型 API Key 未配置
  summary: 当前账号和服务器默认配置都没有可用的聊天模型凭据。
  tags: [llm, api-key, model, configuration]
  content: |
    Agent 对话模型可以使用账号级配置，未配置时回退到部署默认值。API Key 只提交给后端并加密保存或通过部署环境注入，前端只显示“已配置”，不得回显密钥正文。Embedding 模型是服务端 RAG 配置，与聊天模型可以来自不同供应商。

- id: model_call_failed
  title: 模型服务调用失败
  summary: LLM 请求因网络、鉴权、限流、模型名或供应商响应错误而失败。
  tags: [llm, timeout, rate-limit, authentication]
  content: |
    查看经过脱敏的 ModelCall 状态、供应商、模型名和耗时，区分 401 鉴权失败、429 限流、超时和服务端错误。检查 Base URL 是否在允许列表内。不要把 API Key 写入日志，也不要因为模型失败而跳过 Capability、Policy 或审批流程。

- id: structured_decision_invalid
  title: 模型结构化决策未通过 Schema 校验
  summary: 模型返回内容不是合法 AgentDecision，系统已阻止继续规划或执行。
  tags: [llm, schema, decision, fail-closed]
  content: |
    AgentDecision 要求决策类型、请求效果和工具调用彼此一致。例如变更请求必须使用 propose_change，工具决策必须包含已注册能力。系统可以进行一次受限的 JSON 修复；再次失败后应 fail closed，不执行任何新变更，并提示用户重试或缩小问题范围。

- id: embedding_lexical_fallback
  title: Embedding 不可用时退回关键词检索
  summary: 项目文档仍可被检索，但缺少向量语义召回，相关性和召回率可能下降。
  tags: [rag, embedding, lexical, fallback]
  content: |
    检查 Embedding API Key、Base URL、模型名、维度和批量请求限制。已写入数据库的向量维度必须与当前配置一致。回退到词法检索可以保持基础可用性，但不能冒充完整混合检索通过；应在界面或测试报告中明确实际检索模式。

- id: embedding_dimension_mismatch
  title: Embedding 向量维度不一致
  summary: 模型返回维度与数据库向量列或配置的 dimensions 不匹配。
  tags: [rag, embedding, dimension, pgvector]
  content: |
    模型切换后先确认官方输出维度以及 API 是否支持 dimensions 参数，再与数据库 schema 和部署配置对齐。维度变化通常需要重新生成全部文档向量；不能把不同维度的旧向量直接混用。迁移前应保留词法检索回退，并通过评测集比较重建前后的召回率与延迟。

- id: rag_no_relevant_knowledge
  title: 项目知识库没有召回相关内容
  summary: 检索结果为空或未覆盖问题所需证据，回答不应伪装成已有可靠项目依据。
  tags: [rag, retrieval, relevance, knowledge]
  content: |
    先确认文档已验证、已切分且向量回填完成，再检查问题中的术语是否出现在文档或可被语义模型关联。通过固定评测集比较 lexical、vector、RRF 和 reranker，而不是只凭单个问题调参。没有可靠召回时应明确知识缺口，不能附上不相关来源。

- id: rag_latency_tradeoff
  title: RAG 准确率与响应延迟的取舍
  summary: 更大的候选集和 LLM reranker 可能提高排序质量，也会增加网络调用与首字延迟。
  tags: [rag, reranker, latency, evaluation]
  content: |
    先产生有限检索候选，当前按候选中的唯一文档来源数是否大于结果上限决定是否进入重排分支；来源数不足时跳过。还需要启用并配置可用 reranker，不存在已经实现的“高价值问题识别”开关。

    记录 Recall@K、MRR、nDCG、端到端延迟和模型成本。重排超时或返回不合法候选时回退原检索顺序，不能因此跳过操作审批。缓存绑定项目、环境、模型、查询和分块内容版本，文档或模型变化后不能随意复用旧排序。

    排查回复慢应分别看排队、聊天模型、Embedding、重排及 SSH 耗时。小样本检索耗时不包含所有对话环节，不能将毫秒级数据库检索写成整个 Agent 的响应速度。

- id: model_roles_and_configuration
  title: 聊天模型、部署默认、Embedding 与重排分别如何配置
  summary: 网页个人模型覆盖聊天默认，向量模型由部署端配置，重排有独立开关和可选模型名。
  tags: [两个模型, DeepSeek, Qwen, DashScope, 模型设置, 默认模型, 删除模型, embedding]
  content: |
    ## 模型分工
    Agent 聊天模型负责结构化决策或回答；Embedding 将文档和查询变成向量，不能用聊天接口输出的文字假装向量；reranker 对召回候选排序，当前可使用聊天模型完成 listwise 重排。

    ## 配置入口与优先级
    网页模型设置保存当前账号的个人聊天配置，未配置时采用服务器 LLM_* 部署默认。修改供应商或 Base URL 要提供该地址适用的 Key，并先由维护者加入 LLM_ALLOWED_BASE_URLS。恢复部署默认会移除个人覆盖，不等于删除服务器配置。
    Embedding 使用服务端 EMBEDDING_API_KEY、EMBEDDING_BASE_URL、EMBEDDING_MODEL 和 EMBEDDING_DIMENSIONS，不能靠切换网页聊天模型完成迁移。重排由 RERANK_ENABLED 控制，RERANK_MODEL 留空时使用对应 Agent 模型，仍受来源数条件限制。

    ## 保存后的验收
    网页显示供应商、模型和凭据已配置只证明配置存在，需一次真实请求确认服务可用。检查脱敏后的 ModelCall，核对实际模型与调用用途。不要要求系统显示旧 Key 正文；需要更换时提交新的 Key。

- id: rag_indexing_and_quality_checks
  title: 分块、向量索引与检索质量如何检查
  summary: 索引成功和回答准确是不同验收项目，先确认资料范围，再评测证据覆盖。
  tags: [增量分块, 向量索引, 批量, 1536, 20, Recall, MRR, nDCG, 检索质量]
  content: |
    ## 项目文档处理
    Markdown 按标题结构分块，稳定 Chunk 标识和内容 Hash 用于复用未变化内容；缺少向量的块可在后续索引操作回填。当前数据库向量维度为 1536，Provider 请求与配置需要一致，默认按 20 条分批。供应商是否接受模型、维度、批量大小需以实际 API 校验，不能仅凭模型名字推断。

    ## 召回前提
    先核对项目、环境、verified 状态和正文，再检查分块及向量是否就绪。没有向量服务时可退回词法检索；即使有向量也不能保证找到所需知识。当前未启用实验中的相对分数阈值，不要把无召回一概归因为阈值过高。
    系统内置知识当前由 YAML 分类文档加载、按条目词法检索，与数据库项目文档的混合检索链路不同；正文更丰富也不自动等于已经走向量召回。

    ## 质量验收
    固定问题与必需章节，测 Recall@K 的证据覆盖、MRR 的首条证据位置及 nDCG 的排序质量，另测答案正确性和来源支持度。加入相似干扰文档、无答案问题和未用于调参的新题。15 条小样本取得高分不能推断大语料或生产准确率，也不能把索引成功率当成问答准确率。

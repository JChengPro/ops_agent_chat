- id: system_capabilities_and_skills
  title: Ops Agent 能做什么，Skill 与能力边界是什么
  summary: 聊天入口组织受控工具，Skill 提供处理步骤，最终权限由服务端检查。
  tags: [功能, 能力, 能做什么, 菜单, skill, capability, policy, 任意命令]
  content: |
    ## 功能范围
    通用聊天用于解释概念和系统用法；选择项目与环境后，可以查询服务列表、状态、日志、主机资源、已登记健康端点及项目资料。可执行的变更以当前 Registry、运行时支持和策略判定为准，不是所有服务器命令都可用。

    ## 请求如何执行
    API 创建 AgentRun，Worker 领取任务，LangGraph 组织模型决策与工具调用。LLM 输出结构化 Decision，由服务端校验能力名、参数、权限和风险；Runtime Adapter 构造最终执行请求。LLM 不能自行降低风险或授予权限。
    Skill 是可选的版本化流程说明，例如运行诊断、受控服务变更；只能从已有授权能力中收窄选择，不能新增 Shell 权限。未命中 Skill 时可以回到一般 Agent 流程。

    ## 能力不足时
    先明确目标服务和期望结果，查看可用能力是否能覆盖。能力不存在时应说明缺口，由开发人员补充实现、验证与测试，或由有权限的运维人员在系统外操作。知识文档中的命令示例不会自动变成 Agent 的执行权限。

- id: account_login_and_recovery
  title: 账号登录、用户名、会话与忘记密码
  summary: 账号数据集中保存在服务端数据库，密码摘要不可还原，当前未提供邮件找回。
  tags: [账号, 用户名, 邮箱, 登录, 注册, 忘记密码, 修改密码, 会话]
  content: |
    ## 账号与权限
    用户通过服务器 Web 地址访问同一系统，可以使用用户名或邮箱登录。注册是否开放、是否需要邀请码由部署配置决定。账号、密码摘要、项目访问关系与聊天记录保存在 PostgreSQL，而不是每个访问者本机各存一份。
    当前阶段拥有某项目访问资格的用户具有该项目完整功能权限，但仍受审批和执行验证约束。注册不会自动获得其他人的项目或聊天。

    ## 修改密码与设备会话
    已登录用户在账号设置中修改资料、密码或撤销其他设备会话。修改密码需要校验当前密码，并撤销该账号全部登录会话，应重新登录。普通登录与“记住我”的有效期由 JWT_EXPIRE_MINUTES 和 JWT_REMEMBER_EXPIRE_MINUTES 配置。

    ## 无法登录时
    先区分账号或密码错误、会话失效、服务不可用和注册关闭。忘记所有密码时，当前没有邮件找回链路，应由部署维护者核验身份后处理账号恢复。不能从数据库摘要读取原密码；修改 ADMIN_PASSWORD 也不会自动重置已存在用户。不要为了重新初始化管理员而删除数据库卷。

- id: run_lifecycle_and_cancellation
  title: 任务一直等待、取消任务与页面刷新
  summary: 对话异步执行，页面离开不代表取消；任务状态与远程操作结果需要分别查看。
  tags: [queued, running, cancelled, completed, 回复慢, 排队, 取消, 刷新, 没反应]
  content: |
    ## 状态含义
    queued 表示等待 Worker；running 表示处理请求；waiting_for_approval 表示变更等待批准；completed 表示本轮已结束，不保证所有工具都成功；failed 表示本轮失败；cancelled 表示已取消。具体服务是否恢复应看 Action 和验证证据。

    ## 为什么一直等待
    排队较久先检查 Worker 存活、数据库连接和是否被其他任务占用。运行中较慢应查看 Agent 活动及模型、SSH 调用耗时。等待审批时需要用户决定，不会因为页面刷新自动批准。不要靠重复发送相同变更来加速。

    ## 离开页面和取消
    API 入队后由独立 Worker 执行，关闭标签页、切换会话通常不会取消后台任务。回来后应重新读取该会话和 Run 状态。
    取消会阻止后续动作，并防止晚到结果覆盖终态；已经发往目标服务器的命令可能仍然生效。取消不等于回滚，需另做只读检查确认真实状态。远程结果不明时不要盲目再次批准相同变更。

- id: evidence_claim_and_audit
  title: 如何理解证据、文档引用、Claim 与审计
  summary: 文档解释背景，Runtime Evidence 记录现场观察，Claim 表达结论，Audit 记录过程。
  tags: [证据, 引用, 来源, claim, evidence, audit, 置信度, 准确率]
  content: |
    ## 四种信息的区别
    项目文档和系统知识说明配置、历史经验及处理方法；Runtime Evidence 是工具在某时刻读取的现场结果；Claim 是依据这些信息形成的事实、推断或建议；Audit 记录谁在何时做了什么，并通过链式 Hash 支持完整性校验。

    ## 查看回答时如何判断
    先看观测时间、环境、服务和工具是否成功，再看结论是否有对应证据。工具失败也会留下证据，此时证明的是读取失败，不能据此证明目标服务停止。引用某份文档不代表该文档支持回答中的每一句话。
    历史 healthy 记录不证明现在 healthy，completed 不代表 confidence=1.0。涉及当前状态时应请求重新读取。审计链校验也不等于对业务结论正确性的验证。

    ## 来源打开方式
    回答中的系统知识引用可打开所属分类文档并定位小节。项目资料来源与工具证据要分别理解；没有可靠来源时应说明知识缺口，而不是补造文档或现场结论。

- id: system_first_use_workflow
  title: 第一次使用 Ops Agent Chat 的完整流程
  summary: 从登录、模型配置、项目接入到只读验收逐步开始，确认范围后再使用受控变更。
  tags: [第一次使用, 入门, 上手, 使用教程, 操作流程, 新用户]
  content: |
    ## 先完成通用聊天
    打开部署者提供的 Web 地址，按注册配置创建账号或使用已分配账号登录。在模型设置确认个人配置或部署默认可用，先问一个不需要服务器的概念问题。保存模型配置成功不等于供应商已验证，实际回答才能检查完整调用。

    ## 接入项目
    创建项目并登记 Environment、运行时、工作目录和 Connection，维护者在 Ops 部署端挂载 SSH 私钥，目标机安装相应公钥。通过可信渠道确认主机指纹后保存连接。私钥正文不上传网页，工作目录指目标机目录。

    ## 验证知识与现场
    先请求列出服务，核对目标项目和环境，再查询单个服务状态。上传 Markdown 或文本资料并验证后，问一个资料中明确包含的问题，查看引用。采集结构上下文和上传文字资料是不同操作，不能互相代替。

    ## 再使用变更
    选择可接受影响的测试环境，明确目标与操作，阅读审批卡再决定。批准后继续观察执行和独立验证，不能以“已批准”当作完成。最后按需求开启巡检；自动修复开关单独配置，不默认开启所有变更能力。
    每一步失败就停在该层查证据，避免连换模型、重建数据库和重启目标服务导致原因无法定位。

- id: system_question_and_path
  title: 怎样提问，历史知识、实时诊断与修改请求有什么区别
  summary: 写清项目环境、时间范围、目标和是否允许变更，系统会按证据需求选择流程。
  tags: [怎样提问, 提问示例, Knowledge Path, 历史知识, 实时诊断, 请求路由]
  content: |
    ## 知识问题
    例如“项目文档里数据库连接怎么配置”“之前 Access denied 是怎么处理的”。明确历史与文档范围有助于检索，项目知识路径会读取 verified 资料后回答。它不会证明当前数据库可连接。

    ## 现场问题
    例如“测试环境 backend 现在是否正常”“检查启动失败原因，只读调查”。写出环境、准确服务名、观察时间和现象，Agent 按需要读取状态、日志和依赖。复杂诊断可能有多轮模型与工具调用。

    ## 变更问题
    例如“重启测试环境 backend”。涉及真实副作用会经过能力、策略、审批及验证。“有问题就顺便重启”仍含变更意图，不能因为前半句是检查就绕过治理。取消不等于撤销已经送达目标的操作。

    ## 能力边界
    当前只有保守知识路径与原 Agent 流程，没有完整的四级 Router 或通用并行工具调度。知识里的命令示例供有权限的维护者理解，不会自动登记为 Agent 能力。缺资料或目标不明确时补充信息，不要求模型猜生产路径。

- id: system_documentation_map
  title: 内置知识、README、详细设计与教学文档应该看哪份
  summary: 内置手册解决产品使用问题，README 负责入口，设计文档说明实现，报告保留测量依据。
  tags: [内置手册, 文档入口, README, 详细设计, 教学文档, 系统知识库]
  content: |
    ## 面向使用者
    文档页的系统内置知识是开发者维护的只读手册，按使用、部署、连接、执行、巡检、模型和故障主题组织。项目文档则由用户维护本项目业务资料，内容和访问范围与内置知识不同。

    ## 面向维护者
    仓库 README.md 介绍项目定位、能力、快速开始与必要边界；docs/architecture/CURRENT_DESIGN.md 按总体与子系统解释真实调用链和部署；docs/README.md 是专项文档入口。性能结果和故障实验在 test-results 中保留测量条件，不应把单次数字当所有请求的服务承诺。

    ## 版本与来源
    教学文档可能对应较早代码基线，阅读时先看版本说明。部署镜像中的内置知识不会自动从 README 同步；维护者更新 YAML 后必须发布应用镜像。发现手册与行为不一致时记录具体小节与版本，以源码和实际权限检查为准，不能用过时说明授予执行权限。

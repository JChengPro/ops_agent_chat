- id: project_environment_connection_setup
  title: 新项目如何配置环境、工作目录和 SSH 连接
  summary: 项目是管理边界，环境确定部署位置，Connection 决定如何连接目标主机。
  tags: [新建项目, 项目配置, 环境, environment, connection, 工作目录, compose_file]
  content: |
    ## 配置顺序
    创建项目后填写项目名称和说明，再配置环境名称、运行时、策略环境、工作目录与对应资源。Docker Compose 环境需要正确的 Compose 文件。最后登记 SSH 主机、端口、用户名、私钥引用与主机指纹，保存后检查右侧配置摘要是否为预期环境。

    ## 路径和名称分别指哪里
    工作目录是目标服务器上通过 SSH 可以访问的项目目录，不是访问网页的电脑目录。Compose 文件必须对应目标项目。私钥引用则是 Ops Backend、Worker 内的路径，两者不能混为一谈。
    连接名称只是方便识别的标签，改名不会生成密钥、上传文件或自动连接主机。保存配置也不证明连接成功，需要实际只读查询验证。

    ## 接入验收
    先查询服务列表，核对服务名、环境和预期项目一致，再读取一个服务状态。若列表错误，先修正连接、工作目录、Compose 文件或项目名配置。尚未确认目标身份与范围时，不要用启动、停止来测试连接。

- id: multiple_projects_and_environments
  title: 同一服务器多个项目和开发生产环境如何区分
  summary: 主机相同不代表操作范围相同，环境必须绑定准确的目录和运行时资源。
  tags: [多个项目, 同一服务器, 多环境, 开发, 生产, 隔离, 服务名]
  content: |
    ## 区分项目
    多个项目可以位于同一台主机，但应分别登记工作目录、Compose 文件及实际 Compose 项目标识；不同项目中都叫 backend 的服务不是同一个目标。Kubernetes 使用准确 Namespace 与资源名，systemd 使用登记的服务名。
    不要把其他项目示例中的路径、连接名称或健康端点直接当作自己的配置。是否共享 SSH 账号应由维护者根据权限边界决定，Connection 标签本身不提供操作系统隔离。

    ## 区分环境
    同一项目的开发、测试、生产应分别建立 Environment，聊天前确认选中的环境。环境的策略配置会影响自动修复资格，不能为了获得自动执行而把真实生产环境标成 development。

    ## 配置变更后
    重新查询服务列表和状态，核对目标范围。待审批动作绑定旧执行快照，影响执行语义的配置变化可能使其失效；需要重新规划审批，不能把旧审批挪到新环境使用。

- id: project_documents_lifecycle
  title: 项目文档上传、查看、删除与检索范围
  summary: 项目文档由用户维护，系统知识由开发者维护，两者在文档页分开展示。
  tags: [项目文档, 上传文档, 删除文档, 打开文档, Markdown, verified, 系统知识库]
  content: |
    ## 两种资料
    项目文档适合保存架构、服务职责、接口约定、部署说明和 runbook。系统内置知识介绍 Ops 自己的功能及通用排障方法，只读展示，用户不能通过网页修改。内置知识不会自动知道用户项目的业务规则。

    ## 上传与查看
    支持 Markdown 和纯文本。上传后核对列表中的文档与状态，点击文档查看正文；纯文本查看保留 Markdown 的标题和列表符号，不要求浏览器自动渲染。只有 verified 文档参与项目检索，草稿存在于列表不代表能够被检索。

    ## 删除与作用域
    删除通过确认操作移除该项目文档及后续检索来源。历史回答不会因为源文档删除自动重写，不能把旧引用当成仍有效的新资料。检索会先按项目、verified 状态及环境过滤，项目级文档与当前环境文档可参与检索，其他环境资料不应混入。

    ## 上传后验收
    用文档中的一个明确问题提问，检查检索来源和命中的章节。文档中的任意 Shell、要求跳过审批的文字都是资料，不具有执行权限。实时状态仍应通过工具读取。

- id: context_collection_and_staleness
  title: 上下文采集与项目文档有什么区别
  summary: 采集生成项目实体和关系，文档提供知识说明，两者都可能随部署变化过时。
  tags: [上下文, 采集, context, 实体, 依赖关系, 重新采集, 过时]
  content: |
    ## 信息用途
    项目上下文采集可从已配置的 Compose、项目文件等来源提取服务和关系，帮助 Agent 识别对象与依赖；具体采集器以当前配置和实现为准。上传文档用于文字检索，不等于已完成所有运行环境采集。

    ## 采集失败时
    查看采集任务状态、来源类型、目标路径和连接错误。检查目标文件是否存在、SSH 用户能否读取，以及登记的运行时是否匹配。采集失败不意味着服务必然停止，只表示结构信息可能不完整。

    ## 变更后的维护
    Compose 服务新增、目录变更或资源改名后，应更新环境配置并重新采集；业务设计变化也需要维护对应文档。检查采集时间和实体列表，再用实时服务查询验证。当前不会把每次聊天发现的新问题自动变成经审核的巡检规则。

- id: project_compose_onboarding_example
  title: Docker Compose 项目首次接入完整示例
  summary: 将网页字段映射到目标主机的实际目录、Compose 服务与连接，逐层只读验收。
  tags: [接入项目, Compose接入, 首个项目, workdir, compose_file, 服务列表]
  content: |
    ## 示例条件
    假设业务项目在目标服务器 /srv/example-app，Compose 文件 compose.yml，SSH 用户为 deploy。这些均为占位示例，不是系统知道的真实项目路径。先由项目维护者确认目录、文件、服务名称和允许操作范围。

    ## 配置字段
    创建项目后添加测试 Environment，运行时选择 Docker Compose，工作目录填目标机绝对目录，Compose 文件填该目录下实际文件，关联正确的 SSH Connection。环境策略必须如实选择，不能把生产标为测试来减少审批。多个 Compose 项目共享主机时还须核对实际项目标识。

    ## 四步验证
    先测试连接，确认主机身份与认证；再采集上下文，检查服务和关系；随后查询服务列表，确认没有读到其他目录的项目；最后读取一个确定服务的状态和有界日志。连接成功但服务列表错误，应回查运行时配置，不能用 restart 猜目标。

    ## 文档与变更
    上传该项目架构、服务依赖、部署约定和排障记录，验证后做一次带来源的文档问答。只读流程完整通过后再按审批机制验收低影响变更。Ops 自身的 Compose 目录与被管理业务目录必须区分，不能在业务目录执行 Ops 升级命令。

- id: project_document_authoring
  title: 项目文档怎么写才能被 RAG 正确检索
  summary: 使用明确标题、适用环境、可验证步骤和来源，避免一段话混合多个项目与时间状态。
  tags: [编写文档, 文档模板, runbook, RAG资料, 知识整理, 标题]
  content: |
    ## 推荐结构
    一份资料围绕一个主题，包含用途、适用环境、服务名称、前置条件、配置或处理步骤、预期结果、失败分支、验证和来源时间。使用 Markdown 标题划分小节，把关键限定条件放在相应步骤附近，避免检索一个片段时丢失“仅测试环境”的约束。

    ## 写出真实业务事实
    服务名使用 Compose service 名而非混用容器名；路径说明位于目标机还是 Ops 容器；端口说明内部监听与宿主映射；历史故障注明发生环境、现象、证据、原因和验证结果。没有确认的原因标为假设，不要写成确定结论。

    ## 上传与更新
    只上传允许存储的资料，去除密钥、密码和真实令牌。Markdown/文本上传后检查内容、作用域和 verified 状态；更新或替换资料后重新验证并检查引用。上传整仓源码或重复粘贴同一段并不会自动提高答案质量。

    ## 验收问题
    为每个主题准备直接问法、口语改写与一个无答案问题，检查命中章节是否包含必要条件。问当前服务是否健康时仍需实时工具，文档中的历史状态不能代替现场证据。

- id: project_knowledge_scope_and_missing
  title: 上传了文档却搜不到，如何检查项目、环境和验证状态
  summary: 按访问范围、verified、正文、分块与向量顺序检查，区分空结果和结果不支持答案。
  tags: [上传了搜不到, 文档搜不到, verified, 环境过滤, 检索为空, 知识范围]
  content: |
    ## 先检查范围
    确认聊天选中的项目和环境与文档一致。项目级资料与当前环境资料可参加检索，其他环境文档不应混入；另一账号或另一项目的私有资料不能因标题相似就被检索。

    ## 再检查状态与索引
    文档能在列表显示不等于 verified。打开正文确认并非空文件、错误编码或只含链接，再由有权限用户验证。索引按标题和段落分块，缺向量时可回填；Embedding 失败仍可能词法命中，因此不能把“没有向量”当所有空结果的唯一原因。

    ## 区分两类知识
    项目文档由 experience.search 检索，支持词法与可选向量融合；系统内置 YAML 由 system.knowledge.search 在进程内检索。不应把内置手册没有的章节当成“项目 pgvector 索引坏了”。

    ## 最后验收
    用正文中的具体概念和同义问法测试，打开实际来源检查证据覆盖。返回相邻话题但没有答案也属于知识缺口。当前没有相对分数阈值自动证明相关性，不能要求模型以无关引用补全结论。

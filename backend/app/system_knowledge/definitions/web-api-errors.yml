- id: web_login_502_proxy
  title: 网页可以打开但登录 502，Nginx 代理怎么排查
  summary: 502 表示代理未获得正常上游响应，先核对 API 与 Docker DNS，不先重置密码。
  tags: [502, 登录502, 网页可以打开, Nginx, 代理, Docker DNS, upstream, registration]
  content: |
    ## 确认哪一跳失败
    前端静态页面能打开，只证明 Nginx 能提供页面。浏览器登录实际访问 /api/auth/login，注册配置读取 /api/auth/registration；这些都需要代理到 backend。502 与账号密码错误的 401 不同。
    登录接口 /api/auth/login 只接受 POST；不能把普通 curl GET /api/auth/login 当健康检查，它会返回 405 Method Not Allowed，即使后端正常。无凭据的连通性检查应使用 GET /api/auth/registration，预期 200 并返回注册配置 JSON。回答中引用检查命令时保留这个路径与方法，不替换成登录请求。

    ## 部署主机只读检查
    以下使用默认端口，修改过部署端口时同步替换：
    ```sh
    curl -i http://127.0.0.1:5175/api/auth/registration
    curl -i http://127.0.0.1:8000/api/auth/registration
    docker compose logs --tail=100 frontend backend
    docker compose exec -T frontend nginx -t
    ```
    后端直连成功而前端失败时，重点检查代理目标、网络与 DNS；二者都失败则检查 backend 进程、监听和启动错误。不要在命令输出中附带登录密码或 Token。

    ## 容器换 IP 的情况
    backend 重建后 IP 可能改变。当前 Nginx 使用 Docker DNS 127.0.0.11 动态解析 backend，并定期刷新；旧镜像的静态解析可能仍指向旧地址。核对运行镜像中的配置与仓库版本，更新前端镜像后再次验证代理。代理错误不能用删除数据库或重置账号解决。

- id: web_login_status_codes
  title: 登录 401、403、429 与会话失效分别怎么办
  summary: 区分认证失败、权限不足、限流与服务故障，按响应定位，不暴露凭据。
  tags: [登录失败, 401, 403, 429, Token, 会话失效, 账号锁定]
  content: |
    ## 登录请求失败
    登录 401 先核对用户名或邮箱与密码，不连续快速重试。429 表示命中登录限流，应等待限制解除并检查失败原因。403 可能来自账号或具体资源权限、注册配置等，需看当前请求的安全错误摘要，不能把所有 403 都归为密码错误。

    ## 已登录后失败
    页面可打开但受保护 API 返回 401，可能是 Token 过期、会话撤销、密码修改或应用密钥变化。正常重新登录后再试；仍失败时记录服务端时间与响应码。不要手工延长 JWT 或关闭校验。账号登录成功也不代表拥有另一个用户项目的权限。

    ## 服务端区别
    502/503、网络连接失败应先查服务与代理；这些不是输错密码。POST 登录响应不要截图展示 access_token，维护者不应要求用户提供原始密码。忘记密码流程见账号恢复章节，当前没有邮件找回功能。

- id: web_network_and_health
  title: 浏览器打不开、API 不通和健康检查如何分层验证
  summary: 从访问者电脑、部署主机、前端代理到后端分别验证，localhost 随请求位置变化。
  tags: [打不开网页, 连接拒绝, 5175, 8000, localhost, ready, health, live]
  content: |
    ## 地址与入口
    默认浏览器访问 http://部署主机地址:5175。浏览器里的 localhost 是浏览器所在电脑；Ops 容器里的 localhost 是容器自己。Backend 默认只绑定宿主 127.0.0.1:8000，远程浏览器通常经前端代理访问 API，无需开放数据库、Redis 或 AMQP 端口。

    ## 验证顺序
    在部署主机检查 docker compose ps 与端口映射，然后请求前端首页、/api/auth/registration、/health。主机本地成功、远端失败时检查防火墙、路由、WSL 网络模式和实际绑定地址；不要更改账号权限解决网络不可达。

    ## 健康接口的含义
    /live 只检查 API 存活；/ready 和 /health 还检查数据库、checkpoint、Agent 与 Worker 心跳。消费者心跳不等于本次模型、SSH、Redis 或 Broker 的全链路探测。最终验收还需一次普通对话及测试环境只读查询。
    公网部署需要正确的 HTTPS 入口与访问控制。HTTP 不加密密码与令牌，生产配置不能仅以首页返回 200 判为完成。

- id: web_result_refresh_and_sources
  title: 回答没有刷新、重复发送与引用打不开如何处理
  summary: 先核对会话和 Run 状态，区分展示延迟、后台失败与来源已删除。
  tags: [刷新, 回答不显示, 重复发送, 引用打不开, 文档来源, 轮询]
  content: |
    ## 后台是否完成
    记录原 run_id，确认页面当前项目、环境和会话。切换会话或关闭标签页不会自动取消任务。后台已完成而页面未显示时，检查轮询请求响应与登录会话，再刷新原会话，不立即重复提交变更。

    ## 重复请求
    网络重试与用户重新发送是不同动作。系统的请求幂等保护不意味着任意两条相同文字永远合并；新建第二个 Run 可能触发新的规划。变更结果不明时先看原任务和只读证据。

    ## 来源定位
    系统知识引用通过稳定条目 ID 定位分类小节；项目文档可能已删除、未验证或无当前访问权限。历史回答不会随着源资料删除自动重写。引用打不开时应说明来源缺失，不补造出处，也不把旧文档当实时证据。
    后端与 Worker 必须加载相同版本的知识定义，更新后重新加载页面。只修改宿主 docs 目录不会更新镜像中的系统知识 YAML。

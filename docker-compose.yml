services:
  rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-opsagent}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-opsagent_local}
    volumes:
      - ops_agent_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ops-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ops_agent_chat
      POSTGRES_USER: opsagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsagent_password}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ops_agent_postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsagent -d ops_agent_chat"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ops-agent-backend
    restart: unless-stopped
    env_file: .env
    environment: &app-environment
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://opsagent:opsagent_password@postgres:5432/ops_agent_chat}
      VIDEOHUB_SSH_HOST: ${VIDEOHUB_SSH_HOST:-host.docker.internal}
      TASK_BROKER: ${TASK_BROKER:-rabbitmq}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://opsagent:opsagent_local@rabbitmq:5672/%2F}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      KNOWLEDGE_FAST_PATH_ENABLED: ${KNOWLEDGE_FAST_PATH_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./docs:/app/docs:ro
      - ${VIDEOHUB_SSH_KEY_HOST_DIR:-./secrets}:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: ops-agent-frontend
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-5175}:80"
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 330s
    env_file: .env
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docs:/app/docs:ro
      - ${VIDEOHUB_SSH_KEY_HOST_DIR:-./secrets}:/run/secrets:ro
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

  outbox:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment: *app-environment
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "app.outbox_publisher"]

  maintenance:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 330s
    env_file: .env
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docs:/app/docs:ro
      - ${VIDEOHUB_SSH_KEY_HOST_DIR:-./secrets}:/run/secrets:ro
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.maintenance"]

volumes:
  ops_agent_postgres_data:
  ops_agent_rabbitmq_data:
